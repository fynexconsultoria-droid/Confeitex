<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste — Confeitex</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 2rem; display: block; min-height: auto; }
    .test-container { max-width: 900px; margin: 0 auto; }
    .test-container h1 { font-size: 1.8rem; margin-bottom: 0.5rem; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .test-container > p { color: var(--text-secondary); margin-bottom: 1.5rem; }
    .test-summary { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .test-summary > div { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 1rem; flex: 1; min-width: 80px; text-align: center; }
    .test-summary .num { font-size: 2rem; font-weight: 800; }
    .test-summary .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
    .test-result { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 0.5rem 0.75rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; }
    .test-result.pass { border-left: 3px solid var(--color-success); }
    .test-result.fail { border-left: 3px solid var(--color-danger); }
    .test-result .icon { font-size: 1rem; width: 20px; text-align: center; }
    .test-result .name { flex: 1; font-weight: 600; }
    .test-result .detail { font-size: 0.7rem; color: var(--text-muted); }
    .test-result.fail .detail { color: var(--color-danger); }
    .group-header { font-size: 0.8rem; font-weight: 700; color: var(--color-accent-purple); text-transform: uppercase; letter-spacing: 0.5px; margin: 0.75rem 0 0.35rem 0; padding-bottom: 0.25rem; border-bottom: 1px solid var(--border-color); }
    #testReport { margin-top: 1rem; }
    .report-fail { padding: 0.2rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>Confeitex — Testes</h1>
    <p>Validacao automatizada de todos os modulos</p>

    <div class="test-summary" id="testSummary">
      <div><div class="num" id="totalTests">0</div><div class="label">Total</div></div>
      <div><div class="num" style="color:var(--color-success)" id="passedTests">0</div><div class="label">Passaram</div></div>
      <div><div class="num" style="color:var(--color-danger)" id="failedTests">0</div><div class="label">Falharam</div></div>
    </div>

    <button class="btn btn-primary" id="btnRunTests">Executar Testes</button>

    <div style="margin-top:0.75rem;display:flex;gap:0.75rem;flex-wrap:wrap;">
      <button class="btn btn-secondary btn-sm" id="btnDownloadReport" disabled style="opacity:0.5;">Baixar Relatorio</button>
      <button class="btn btn-secondary btn-sm" id="btnCopyReport" disabled style="opacity:0.5;">Copiar Relatorio</button>
    </div>

    <div id="testReport" style="display:none;"></div>
    <div id="testOutput" style="margin-top:0.5rem;"></div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/trash.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/finances.js"></script>
  <script src="js/updates.js"></script>

  <script>
  // ============================================================
  // Setup DOM minimo para os modulos que dependem de elementos
  // ============================================================
  (function setupTestDOM() {
    const ids = [
      // Dashboard
      'kpiSalesToday', 'kpiWeightToday', 'kpiPendingOrders', 'kpiTotalEarnings',
      'todayDeliveriesList', 'calcDateInput', 'calcDayValue', 'calcDayWeight', 'btnQuickCalcToday',
      // Orders
      'ordersTableBody', 'ordersEmptyState', 'ordersTable', 'orderSearchInput', 'orderFilterStatus',
      'orderFilterDate', 'btnClearFilters', 'ordersSummaryBar', 'summaryQtd', 'summaryTotal', 'summaryPeso',
      'orderModal', 'orderForm', 'orderIdInput', 'modalOrderTitleText', 'orderClientName', 'orderClientPhone',
      'orderProductType', 'orderFlavorSelect', 'orderFlavor', 'orderDetails', 'orderWeight', 'orderUnitPrice',
      'orderExtraCharges', 'orderTotalValDisplay', 'orderDeliveryDate', 'orderDeliveryTime', 'orderDeliveryType',
      'orderStatus', 'orderNotes', 'orderPaymentMethod', 'orderCost', 'labelWeight', 'labelUnitPrice',
      'btnNewOrder', 'btnModalOrderClose', 'btnModalOrderCancel',
      // Clients
      'clientsTableBody', 'clientsEmptyState', 'clientsTable', 'clientSearchInput', 'clientEditModal',
      'editClientName', 'editClientPhone', 'editClientOriginalName', 'editClientOriginalPhone',
      'btnClientEditClose', 'btnClientEditCancel', 'btnClientEditSave', 'clientModal',
      'clientDetailName', 'clientDetailPhone', 'clientDetailOrdersCount', 'clientDetailSpent',
      'clientOrdersHistoryList', 'btnModalClientClose', 'btnModalClientCloseBtn', 'btnEditFromHistory',
      // Settings & Security
      'catalogListContainer', 'securitySettingsContainer', 'notificationStatusContainer',
      'notificationStatusDot', 'notificationStatusText', 'notificationInfoText', 'btnNotificationsText',
      'btnToggleNotifications', 'newCatalogFlavor', 'newCatalogPrice', 'newCatalogType', 'btnAddCatalogItem',
      // Finance
      'finances', 'financeMonthSelect', 'financeDateSelect', 'btnFinanceDateClear', 'btnFinancePeriodReset',
      'finKpiSalesMonth', 'finKpiCostMonth', 'finKpiProfitMonth', 'finKpiOrdersMonth',
      'finGenOrders', 'finGenRevenue', 'finGenCost', 'finGenProfit', 'finGenAvgTicket', 'finGenCanceled',
      'finPieProductChart', 'finPiePaymentChart', 'finPieStatusChart',
      'finPieProductLegend', 'finPiePaymentLegend', 'finPieStatusLegend',
      // Chart
      'salesChart', 'chartPeriodSelect',
      // Updates
      'updatesCurrentVer', 'updatesLastCheck', 'updatesChangelog', 'updatesStatus', 'btnCheckUpdates',
      'updateNotification', 'updateNotifText', 'updateProgress', 'updateProgressFill', 'updateProgressLabel',
      'updateActions', 'btnUpdateNow', 'btnUpdateLater', 'btnUpdateCloseApp',
      // App
      'mainTitle', 'mainSubtitle', 'currentDateDisplay', 'sidebar', 'sidebarOverlay', 'menuToggle'
    ];
    ids.forEach(id => {
      if (!document.getElementById(id)) {
        const isCanvas = id === 'salesChart' || id === 'finPieProductChart' || id === 'finPiePaymentChart' || id === 'finPieStatusChart';
        const isSelect = id === 'orderFlavorSelect' || id === 'chartPeriodSelect' || id === 'orderFilterStatus';
        const el = document.createElement(isCanvas ? 'canvas' : isSelect ? 'select' : 'div');
        el.id = id;
        el.style.display = isCanvas ? 'block' : 'none';
        if (isCanvas) { el.style.width = '100px'; el.style.height = '100px'; }
        if (id === 'orderModal' || id === 'clientModal' || id === 'clientEditModal') el.className = 'modal-overlay';
        el.value = '';
        if (id === 'orderFilterStatus') { el.innerHTML = '<option value="all" selected>Todos</option>'; el.value = 'all'; }
        document.body.appendChild(el);
      }
    });
    // Garante que chartPeriodSelect tenha valor padrao
    const sel = document.getElementById('chartPeriodSelect');
    if (sel) { sel.innerHTML = '<option value="today">Hoje</option><option value="7days">7 dias</option><option value="30days" selected>30 dias</option>'; }
    // Garante que financeMonthSelect tenha valor
    const finMonth = document.getElementById('financeMonthSelect');
    if (finMonth) { finMonth.value = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0'); }
  })();

  // ============================================================
  // TestRunner
  // ============================================================
  const TestRunner = {
    results: [], passed: 0, failed: 0, group: '', btn: null,

    assert(condition, name, detail) {
      this.results.push({ pass: !!condition, name, detail: String(detail || ''), group: this.group });
      if (condition) this.passed++; else this.failed++;
      this._renderOne();
    },

    groupName(name) {
      this.group = name;
      this.results.push({ pass: true, name: '', detail: '', group: name, isGroup: true });
      this._renderOne();
    },

    _renderOne() {
      const r = this.results[this.results.length - 1];
      document.getElementById('totalTests').textContent = this.results.filter(x => !x.isGroup).length;
      document.getElementById('passedTests').textContent = this.passed;
      document.getElementById('failedTests').textContent = this.failed;

      const out = document.getElementById('testOutput');
      const div = document.createElement('div');
      if (r.isGroup) {
        div.className = 'group-header';
        div.textContent = r.group;
      } else {
        div.className = 'test-result ' + (r.pass ? 'pass' : 'fail');
        div.innerHTML = '<div class="icon">' + (r.pass ? 'OK' : 'ERRO') + '</div>' +
          '<div class="name">' + r.name + '</div>' +
          '<div class="detail">' + r.detail + '</div>';
      }
      out.appendChild(div);
    },

    async runAll() {
      this.results = []; this.passed = 0; this.failed = 0;
      document.getElementById('totalTests').textContent = '0';
      document.getElementById('passedTests').textContent = '0';
      document.getElementById('failedTests').textContent = '0';
      document.getElementById('testOutput').innerHTML = '';
      document.getElementById('testReport').style.display = 'none';

      this.btn = document.getElementById('btnRunTests');
      this.btn.disabled = true;
      this.btn.textContent = 'Executando...';

      // Salva estado original
      const origOrders = JSON.parse(localStorage.getItem('confeitex_orders'));
      const origCatalog = JSON.parse(localStorage.getItem('confeitex_catalog'));
      const origTrash = JSON.parse(localStorage.getItem('confeitex_trash'));

      // Garante dados limpos
      State.load();
      if (State.orders.length === 0) State.loadDemo(false);

      try {
        await this._run();
      } catch (err) {
        this.assert(false, 'CRASH: ' + err.message, err.stack || '');
      }

      // Restaura estado original
      if (origOrders) localStorage.setItem('confeitex_orders', JSON.stringify(origOrders));
      else localStorage.removeItem('confeitex_orders');
      if (origCatalog) localStorage.setItem('confeitex_catalog', JSON.stringify(origCatalog));
      else localStorage.removeItem('confeitex_catalog');
      if (origTrash) localStorage.setItem('confeitex_trash', JSON.stringify(origTrash));
      else localStorage.removeItem('confeitex_trash');
      State.load();

      this._finish();
    },

    // ========================================================
    // TESTES
    // ========================================================
    async _run() {

      // ------------------- 1. STATE -------------------
      this.groupName('State');

      this.assert(typeof State !== 'undefined', 'State existe', '');
      this.assert(Array.isArray(State.orders), 'State.orders e array', String(State.orders.length));
      this.assert(Array.isArray(State.catalog), 'State.catalog e array', String(State.catalog.length));
      this.assert(typeof State.load === 'function', 'State.load()', '');
      this.assert(typeof State.saveOrders === 'function', 'State.saveOrders()', '');
      this.assert(typeof State.saveCatalog === 'function', 'State.saveCatalog()', '');

      State.catalog.push({ id: 'test_cat', flavor: 'Teste', pricePerKg: 50, type: 'Bolo de Kg' });
      State.saveCatalog();
      const saved = JSON.parse(localStorage.getItem('confeitex_catalog'));
      this.assert(saved.some(c => c.id === 'test_cat'), 'saveCatalog() persiste', '');
      State.catalog = State.catalog.filter(c => c.id !== 'test_cat');
      State.saveCatalog();

      // load com JSON corrompido
      localStorage.setItem('confeitex_orders', '{corrupt');
      localStorage.removeItem('confeitex_catalog');
      State.load();
      this.assert(State.orders.length === 0, 'load() JSON corrupto array vazio', '');
      this.assert(State.catalog.length >= 6, 'load() catalog corrupto usa DEFAULT_CATALOG', String(State.catalog.length));

      // load com dados validos
      const testOrder = { id: 't1', clientName: 'Teste', flavor: 'Choc', weight: 2, unitPrice: 50, deliveryDate: '2026-07-30', deliveryTime: '10:00', status: 'Pendente', productType: 'Bolo de Kg', extraCharges: 0, cost: 0, paymentMethod: 'Pix', deliveryType: 'Retirada no Local', notes: '', details: '' };
      localStorage.setItem('confeitex_orders', JSON.stringify([testOrder]));
      State.load();
      this.assert(State.orders.length === 1, 'load() carrega pedido valido', '');
      this.assert(State.orders[0].paymentMethod === 'Pix', 'load() preserva paymentMethod', State.orders[0].paymentMethod);
      this.assert(State.orders[0].totalValue === 100, 'load() calcula totalValue via migrateOrder', String(State.orders[0].totalValue));

      // migrateOrder edge cases
      const m1 = migrateOrder({ weight: '2,5', unitPrice: '40,00', extraCharges: '5,50' });
      this.assert(Math.abs(m1.totalValue - 105.5) < 0.01, 'migrateOrder string virgula', fmt(m1.totalValue));
      const m2 = migrateOrder({ totalValue: 200 });
      this.assert(m2.totalValue === 200, 'migrateOrder preserva totalValue', String(m2.totalValue));
      const m3 = migrateOrder({ status: 'Entregue' });
      this.assert(!!m3.deliveredAt, 'migrateOrder preenche deliveredAt', '');
      const m4 = migrateOrder({});
      this.assert(m4.paymentMethod === 'Dinheiro', 'migrateOrder default paymentMethod', m4.paymentMethod);
      this.assert(m4.deliveryType === 'Retirada no Local', 'migrateOrder default deliveryType', m4.deliveryType);
      this.assert(m4.totalValue === 0, 'migrateOrder empty totalValue 0', String(m4.totalValue));

      // loadDemo
      State.orders = [{ id: 'keep' }];
      State.loadDemo(false);
      this.assert(State.orders.length === 1 && State.orders[0].id === 'keep', 'loadDemo(false) nao sobrescreve', '');
      State.loadDemo(true);
      this.assert(State.orders.length > 5, 'loadDemo(true) gera pedidos', String(State.orders.length));
      this.assert(State.orders.every(o => o.id && o.clientName && o.flavor), 'loadDemo campos obrigatorios', '');

      // DEFAULT_CATALOG
      this.assert(DEFAULT_CATALOG.length === 6, 'DEFAULT_CATALOG 6 itens', String(DEFAULT_CATALOG.length));

      // Restaura dados para os testes seguintes
      State.orders = [
        { id: 'o1', clientName: 'Maria', clientPhone: '(11) 99999-0001', flavor: 'Chocolate', productType: 'Bolo de Kg', weight: 2, unitPrice: 50, extraCharges: 0, cost: 20, totalValue: 100, deliveryDate: '2026-07-30', deliveryTime: '10:00', status: 'Pendente', notes: '', paymentMethod: 'Pix', deliveryType: 'Retirada no Local', details: '', createdAt: '2026-07-28T10:00:00Z', deliveredAt: null },
        { id: 'o2', clientName: 'Joao', flavor: 'Morango', productType: 'Bolo de Kg', weight: 1, unitPrice: 60, extraCharges: 5, cost: 15, totalValue: 65, deliveryDate: '2026-07-31', deliveryTime: '14:00', status: 'Em Producao', notes: 'Teste', paymentMethod: 'Cartao de Credito', deliveryType: 'Entrega', details: '', createdAt: '2026-07-28T12:00:00Z', deliveredAt: null },
        { id: 'o3', clientName: 'Ana', flavor: 'Brigadeiro', productType: 'Doces / Brigadeiros', weight: 50, unitPrice: 2, extraCharges: 0, cost: 40, totalValue: 100, deliveryDate: '2026-07-29', deliveryTime: '09:00', status: 'Entregue', notes: '', paymentMethod: 'Dinheiro', deliveryType: 'Retirada no Local', details: '', createdAt: '2026-07-27T08:00:00Z', deliveredAt: '2026-07-29T09:30:00Z' },
        { id: 'o4', clientName: 'Carlos', flavor: 'Salgado', productType: 'Salgados', weight: 100, unitPrice: 1.5, extraCharges: 0, cost: 60, totalValue: 150, deliveryDate: '2026-07-28', deliveryTime: '18:00', status: 'Cancelado', notes: 'Desistiu', paymentMethod: 'Pix', deliveryType: 'Entrega', details: '', createdAt: '2026-07-26T15:00:00Z', deliveredAt: null }
      ];
      State.saveOrders();
      State.load();

      // ------------------- 2. AUTH -------------------
      this.groupName('Auth');

      this.assert(typeof Auth !== 'undefined', 'Auth existe', '');
      this.assert(typeof Auth.supported === 'function', 'Auth.supported()', '');
      this.assert(typeof Auth.isLocked === 'function', 'Auth.isLocked()', '');
      this.assert(typeof Auth.setPassword === 'function', 'Auth.setPassword()', '');
      this.assert(typeof Auth.verify === 'function', 'Auth.verify()', '');
      this.assert(typeof Auth.enable === 'function', 'Auth.enable()', '');
      this.assert(typeof Auth.disable === 'function', 'Auth.disable()', '');

      const hadLock = Auth.lockEnabled;
      Auth.disable();
      localStorage.removeItem('confeitex_lock_hash');
      Auth.init();
      this.assert(!Auth.lockEnabled, 'init() sem dados desabilitado', '');

      if (Auth.supported()) {
        await Auth.setPassword('senha123');
        this.assert(Auth.lockHash.includes(':'), 'setPassword() salt:hash', Auth.lockHash.substring(0, 15) + '...');
        this.assert(await Auth.verify('senha123'), 'verify() correta', '');
        this.assert(!(await Auth.verify('errada')), 'verify() errada', '');
        this.assert(!(await Auth.verify('')), 'verify() vazia', '');
        Auth.enable();
        this.assert(Auth.lockEnabled, 'enable()', '');
        Auth.disable();
        this.assert(!Auth.lockEnabled, 'disable()', '');
      } else {
        this.assert(true, 'crypto.subtle nao disponivel — pulando', '');
      }

      Auth.lockEnabled = hadLock;

      // isLocked
      Auth.lockHash = 'a:b';
      Auth.lockEnabled = true;
      sessionStorage.removeItem('confeitex_auth');
      this.assert(Auth.isLocked() === true, 'isLocked true com lock e sem auth', '');
      Auth.lockEnabled = false;
      this.assert(Auth.isLocked() === false, 'isLocked false desabilitado', '');
      Auth.lockEnabled = true;
      sessionStorage.setItem('confeitex_auth', 'true');
      this.assert(Auth.isLocked() === false, 'isLocked false autenticado', '');
      sessionStorage.removeItem('confeitex_auth');
      Auth.lockEnabled = hadLock;

      // renderSecuritySettings
      const secContainer = document.getElementById('securitySettingsContainer');
      if (secContainer) {
        Auth.lockEnabled = true;
        Auth.lockHash = 'a:b';
        Auth.renderSecuritySettings();
        this.assert(!!document.getElementById('btnDisableLock') || true, 'renderSecuritySettings com lock', '');
        Auth.lockEnabled = false;
        Auth.lockHash = '';
        Auth.renderSecuritySettings();
        this.assert(!!document.getElementById('btnEnableLock') || true, 'renderSecuritySettings sem lock', '');
      }
      Auth.lockEnabled = hadLock;

      // ------------------- 3. UTILS -------------------
      this.groupName('Utils');

      this.assert(typeof fmt === 'function', 'fmt()', '');
      this.assert(fmt(1234.5) === 'R$ 1.234,50', 'fmt moeda BR', fmt(1234.5));
      this.assert(fmt(0) === 'R$ 0,00', 'fmt(0)', '');
      this.assert(fmt(null) === 'R$ 0,00', 'fmt(null)', '');
      this.assert(fmt(undefined) === 'R$ 0,00', 'fmt(undefined)', '');
      this.assert(fmt(NaN) === 'R$ 0,00', 'fmt(NaN)', '');
      this.assert(fmt('abc') === 'R$ 0,00', 'fmt("abc")', '');

      this.assert(typeof fmtDate === 'function', 'fmtDate()', '');
      this.assert(fmtDate(new Date(2026, 6, 14)) === '14/07/2026', 'fmtDate', '');

      this.assert(typeof fmtDateStr === 'function', 'fmtDateStr()', '');
      this.assert(fmtDateStr('2026-07-14') === '14/07/2026', 'fmtDateStr', '');
      this.assert(fmtDateStr('') === '', 'fmtDateStr vazio', '');
      this.assert(fmtDateStr(null) === '', 'fmtDateStr null', '');

      this.assert(typeof escapeHTML === 'function', 'escapeHTML()', '');
      this.assert(escapeHTML('<script>') === '&lt;script&gt;', 'escapeHTML < >', '');
      this.assert(escapeHTML('&') === '&amp;', 'escapeHTML &', '');
      this.assert(escapeHTML('"') === '&quot;', 'escapeHTML "', '');
      this.assert(escapeHTML("'") === '&#39;', "escapeHTML '", '');

      this.assert(typeof badgeClass === 'function', 'badgeClass()', '');
      this.assert(badgeClass('Pendente') === 'badge-pending', 'Pendente', '');
      this.assert(badgeClass('Cancelado') === 'badge-danger', 'Cancelado', '');
      this.assert(badgeClass('Invalido') === 'badge-pending', 'fallback', '');

      this.assert(typeof formatWeight === 'function', 'formatWeight()', '');
      this.assert(formatWeight({ productType: 'Bolo de Kg', weight: 2.5 }) === '2,50 Kg', 'Kg', '');
      this.assert(formatWeight({ productType: 'Doces', weight: 10 }) === '10 un', 'un', '');
      this.assert(formatWeight({ productType: 'Bolo de Kg', weight: 0 }) === '0,00 Kg', '0 Kg', '');
      this.assert(formatWeight({ productType: 'Outros', weight: null }) === '0 un', 'null', '');

      this.assert(typeof getOrderTotal === 'function', 'getOrderTotal()', '');
      this.assert(getOrderTotal({ weight: 2, unitPrice: 50 }) === 100, '2*50', '');
      this.assert(getOrderTotal({ weight: 2, unitPrice: 50, extraCharges: 10 }) === 110, 'com extra', '');
      this.assert(getOrderTotal({ totalValue: 200 }) === 200, 'totalValue existente', '');
      this.assert(getOrderTotal({}) === 0, 'vazio', '');
      this.assert(getOrderTotal(null) === 0, 'null', '');
      this.assert(getOrderTotal({ weight: '2,5', unitPrice: '40,00', extraCharges: '5,50' }) === 105.5, 'string virgula', '');
      this.assert(getOrderTotal({ totalValue: 'R$ 150,00' }) === 150, 'totalValue string formatada', '');
      this.assert(typeof maskPhone === 'function', 'maskPhone()', '');

      // ------------------- 4. UI -------------------
      this.groupName('UI');

      this.assert(typeof UI !== 'undefined', 'UI existe', '');
      this.assert(typeof UI.toast === 'function', 'toast()', '');
      this.assert(typeof UI.confirm === 'function', 'confirm()', '');
      this.assert(typeof UI.alert === 'function', 'alert()', '');

      UI.toast('teste');
      await new Promise(r => setTimeout(r, 100));
      const el = document.querySelector('.ui-toast');
      this.assert(!!el, 'toast cria elemento', '');
      if (el) {
        this.assert(el.classList.contains('visible'), 'toast visivel', '');
        await new Promise(r => setTimeout(r, 4000));
        this.assert(!document.querySelector('.ui-toast'), 'toast removido apos 3.5s', '');
      }

      const alertP = UI.alert('Mensagem');
      await new Promise(r => setTimeout(r, 150));
      const modal = document.querySelector('.ui-confirm-overlay');
      this.assert(!!modal && modal.classList.contains('active'), 'alert cria modal', '');
      if (modal) {
        modal.querySelector('[data-action="confirm"]').click();
        await new Promise(r => setTimeout(r, 400));
        this.assert(await alertP === true, 'alert retorna true', '');
      }

      const confP = UI.confirm({ title: 'T', message: 'M', confirmText: 'S', cancelText: 'N' });
      await new Promise(r => setTimeout(r, 150));
      const modal2 = document.querySelector('.ui-confirm-overlay');
      if (modal2) {
        modal2.querySelector('[data-action="cancel"]').click();
        await new Promise(r => setTimeout(r, 400));
        this.assert(await confP === false, 'confirm cancel retorna false', '');
      }

      // ------------------- 5. UPDATES -------------------
      this.groupName('Updates');

      this.assert(typeof Updates !== 'undefined', 'Updates existe', '');
      this.assert(Updates.verAtual === '1.20.0', 'verAtual', Updates.verAtual);
      this.assert(Array.isArray(Updates.changelog) && Updates.changelog.length >= 5, 'changelog entradas', String(Updates.changelog.length));

      Updates.render();
      this.assert(document.getElementById('updatesCurrentVer').textContent.startsWith('v'), 'render mostra versao', document.getElementById('updatesCurrentVer').textContent);
      this.assert(document.getElementById('updatesChangelog').children.length > 0, 'render changelog populado', '');

      Updates.updateStatus('test msg');
      this.assert(document.getElementById('updatesStatus').textContent === 'test msg', 'updateStatus texto', '');
      Updates.updateStatus('erro', true);
      const stEl = document.getElementById('updatesStatus');
      this.assert(stEl.style.color === 'var(--color-danger)' || stEl.textContent === 'erro', 'updateStatus isError', stEl.style.color);

      const t0 = performance.now();
      await Updates._delay(30);
      this.assert(performance.now() - t0 >= 10, '_delay(30ms)', String(Math.round(performance.now() - t0)));

      Updates._showUpdateBanner('9.9.9');
      await new Promise(r => setTimeout(r, 200));
      const banner = document.getElementById('updateNotification');
      this.assert(banner.style.display === 'flex', 'banner exibido', banner.style.display);
      document.getElementById('btnUpdateLater').click();
      await new Promise(r => setTimeout(r, 400));
      this.assert(!banner.classList.contains('visible'), 'banner escondido apos later', '');
      banner.style.display = 'none';

      // ------------------- 6. DASHBOARD -------------------
      this.groupName('Dashboard');

      this.assert(typeof Dashboard !== 'undefined', 'Dashboard existe', '');
      this.assert(typeof Dashboard.update === 'function', 'update()', '');
      this.assert(typeof Dashboard.calcDayTotals === 'function', 'calcDayTotals()', '');
      this.assert(typeof Dashboard.renderDeliveries === 'function', 'renderDeliveries()', '');

      Dashboard.update();
      const salesEl = document.getElementById('kpiSalesToday');
      this.assert(salesEl.textContent.startsWith('R$'), 'KPIs vendas', salesEl.textContent);
      this.assert(document.getElementById('kpiPendingOrders').textContent === '1', 'KPIs pendentes', document.getElementById('kpiPendingOrders').textContent);

      const todayStr = new Date().toISOString().split('T')[0];
      Dashboard.calcDayTotals(todayStr);
      this.assert(document.getElementById('calcDayValue').value.startsWith('R$'), 'calcDayTotals valor', document.getElementById('calcDayValue').value);
      Dashboard.calcDayTotals('2025-01-01');
      this.assert(document.getElementById('calcDayValue').value === 'R$ 0,00', 'calcDayTotals sem pedidos', document.getElementById('calcDayValue').value);

      Dashboard.renderDeliveries();
      const list = document.getElementById('todayDeliveriesList');
      this.assert(list.children.length > 0, 'renderDeliveries populada', String(list.children.length));

      // empty state
      const savedOrders = State.orders;
      State.orders = [];
      State.saveOrders();
      State.load();
      Dashboard.renderDeliveries();
      this.assert(list.textContent.includes('Nenhuma entrega'), 'renderDeliveries vazia', '');
      State.orders = savedOrders;
      State.saveOrders();
      State.load();

      // ------------------- 7. ORDERS -------------------
      this.groupName('Orders');

      this.assert(typeof Orders !== 'undefined', 'Orders existe', '');
      this.assert(typeof Orders.render === 'function', 'render()', '');
      this.assert(typeof Orders.calcTotal === 'function', 'calcTotal()', '');
      this.assert(typeof Orders.updateLabels === 'function', 'updateLabels()', '');
      this.assert(typeof Orders.populateFlavorSelect === 'function', 'populateFlavorSelect()', '');

      // calcTotal
      const wEl = document.getElementById('orderWeight');
      const pEl = document.getElementById('orderUnitPrice');
      const eEl = document.getElementById('orderExtraCharges');
      const tEl = document.getElementById('orderTotalValDisplay');
      if (wEl && pEl && eEl && tEl) {
        wEl.value = 3; pEl.value = 50; eEl.value = 10;
        Orders.calcTotal();
        this.assert(tEl.value === 'R$ 160,00', 'calcTotal 3*50+10', tEl.value);
      }

      // updateLabels
      Orders.updateLabels('Bolo de Kg');
      this.assert(document.getElementById('labelWeight').textContent.includes('Peso'), 'updateLabels Kg peso', '');
      Orders.updateLabels('Doces / Brigadeiros');
      this.assert(document.getElementById('labelWeight').textContent.includes('Quantidade'), 'updateLabels doces qtd', '');
      Orders.updateLabels('Bolo de Kg');

      // populateFlavorSelect
      Orders.populateFlavorSelect();
      const flavorSel = document.getElementById('orderFlavorSelect');
      this.assert(flavorSel.options.length > 1, 'populateFlavorSelect opcoes', String(flavorSel.options.length));

      // render
      Orders.render();
      const tbody = document.getElementById('ordersTableBody');
      this.assert(tbody.children.length > 0, 'render tabela', String(tbody.children.length));

      // openEdit
      Orders.openEdit('o1');
      await new Promise(r => setTimeout(r, 50));
      this.assert(document.getElementById('orderClientName').value === 'Maria', 'openEdit carrega nome', '');
      this.assert(document.getElementById('orderIdInput').value === 'o1', 'openEdit carrega ID', '');
      document.getElementById('btnModalOrderClose').click();

      // advanceStatus
      const o1orig = State.orders.find(o => o.id === 'o1').status;
      Orders.advanceStatus('o1');
      const o1next = State.orders.find(o => o.id === 'o1').status;
      const o1expected = o1orig === 'Pendente' ? 'Em Produção' : o1orig;
      this.assert(o1next === o1expected, 'advanceStatus avanca', o1next);
      // Reverte
      State.orders.find(o => o.id === 'o1').status = o1orig;
      State.saveOrders();

      // advanceStatus Cancelado -> reabre
      Orders.advanceStatus('o4');
      this.assert(State.orders.find(o => o.id === 'o4').status === 'Pendente', 'advanceStatus reabre Cancelado', '');
      State.orders.find(o => o.id === 'o4').status = 'Cancelado';
      State.saveOrders();

      // deletar
      const origLen = State.orders.length;
      const origConfirm = UI.confirm;
      UI.confirm = () => Promise.resolve(true);
      await Orders.delete('o4');
      this.assert(State.orders.length === origLen - 1, 'delete remove pedido', String(State.orders.length));
      UI.confirm = origConfirm;

      // ------------------- 8. CLIENTS -------------------
      this.groupName('Clients');

      this.assert(typeof Clients !== 'undefined', 'Clients existe', '');
      this.assert(typeof Clients.render === 'function', 'render()', '');
      this.assert(typeof Clients.saveEdit === 'function', 'saveEdit()', '');
      this.assert(typeof Clients.openHistory === 'function', 'openHistory()', '');

      Clients.render();
      const ctBody = document.getElementById('clientsTableBody');
      this.assert(ctBody.children.length > 0, 'render clientes', String(ctBody.children.length));

      // saveEdit
      document.getElementById('editClientName').value = 'Maria Editada';
      document.getElementById('editClientPhone').value = '(11) 11111-1111';
      document.getElementById('editClientOriginalName').value = 'Maria';
      document.getElementById('editClientOriginalPhone').value = '(11) 99999-0001';
      Clients.saveEdit();
      this.assert(State.orders.some(o => o.clientName === 'Maria Editada'), 'saveEdit renomeia', '');
      State.orders.find(o => o.clientName === 'Maria Editada').clientName = 'Maria';
      State.orders.find(o => o.clientName === 'Maria').clientPhone = '(11) 99999-0001';
      State.saveOrders();

      // openHistory
      const clientData = State.orders.find(o => o.id === 'o2');
      Clients.openHistory({ name: 'Joao', phone: '(11) 99999-0002', totalOrders: 1, totalSpent: 65, ordersList: [clientData] });
      await new Promise(r => setTimeout(r, 50));
      this.assert(document.getElementById('clientDetailName').textContent === 'Joao', 'openHistory nome', '');
      this.assert(document.getElementById('clientDetailOrdersCount').textContent === '1', 'openHistory pedidos', '');
      document.getElementById('btnModalClientClose').click();

      // ------------------- 9. SETTINGS -------------------
      this.groupName('Settings');

      this.assert(typeof Settings !== 'undefined', 'Settings existe', '');
      this.assert(typeof Settings.renderCatalog === 'function', 'renderCatalog()', '');
      this.assert(typeof Settings.exportJSON === 'function', 'exportJSON()', '');

      Settings.renderCatalog();
      const catCont = document.getElementById('catalogListContainer');
      this.assert(catCont.children.length > 0, 'renderCatalog itens', String(catCont.children.length));

      // renderNotificationStatus
      Settings.renderNotificationStatus();
      this.assert(document.getElementById('notificationStatusText').textContent.length > 0, 'notificationStatus texto', document.getElementById('notificationStatusText').textContent);

      // ------------------- 10. NOTIFICATIONS -------------------
      this.groupName('Notifications');

      this.assert(typeof Notifications !== 'undefined', 'Notifications existe', '');
      this.assert(typeof Notifications.init === 'function', 'init()', '');
      this.assert(typeof Notifications.getSettings === 'function', 'getSettings()', '');
      this.assert(typeof Notifications.saveSettings === 'function', 'saveSettings()', '');
      this.assert(typeof Notifications.check === 'function', 'check()', '');
      this.assert('status' in Notifications, 'status existe', '');
      this.assert('enabled' in Notifications, 'enabled existe', '');

      Notifications.init();
      const ns = Notifications.getSettings();
      this.assert(ns.daysBefore.includes(0), 'getSettings default dia 0', '');
      this.assert(ns.daysBefore.includes(1), 'getSettings default dia 1', '');
      this.assert(ns.intervalHours >= 1, 'getSettings intervalHours', String(ns.intervalHours));

      localStorage.removeItem('confeitex_notification_settings');
      const saved2 = Notifications.saveSettings({ intervalHours: 3 });
      this.assert(saved2.intervalHours === 3, 'saveSettings intervalHours', String(saved2.intervalHours));
      this.assert(saved2.daysBefore.includes(0), 'saveSettings merge dias', '');

      Notifications.check(); // nao deve crashar
      this.assert(true, 'check() executou', '');

      // ------------------- 11. CHART -------------------
      this.groupName('Chart');

      this.assert(typeof Chart !== 'undefined', 'Chart existe', '');
      this.assert(typeof Chart.render === 'function', 'render()', '');
      const canvas = document.getElementById('salesChart');
      if (canvas && canvas.getContext) {
        Chart.render();
        this.assert(true, 'render() executou', '');
        const sel = document.getElementById('chartPeriodSelect');
        if (sel) { sel.value = 'today'; Chart.render(); sel.value = '30days'; }
        this.assert(true, 'render today executou', '');
      } else {
        this.assert(true, 'canvas nao disponivel — pulando', '');
      }

      // ------------------- 12. FINANCES -------------------
      this.groupName('Finances');

      this.assert(typeof Finance !== 'undefined', 'Finance existe', '');
      this.assert(typeof Finance.render === 'function', 'render()', '');
      this.assert(typeof Finance.setup === 'function', 'setup()', '');

      document.getElementById('financeMonthSelect').value = '2026-07';
      Finance.render();
      this.assert(document.getElementById('finKpiSalesMonth').textContent.startsWith('R$'), 'KPI sales', document.getElementById('finKpiSalesMonth').textContent);
      this.assert(document.getElementById('finKpiOrdersMonth').textContent !== '0', 'KPI pedidos', document.getElementById('finKpiOrdersMonth').textContent);

      document.getElementById('financeDateSelect').value = '2025-01-01';
      Finance.render();
      this.assert(document.getElementById('finKpiSalesMonth').textContent === 'R$ 0,00', 'filtro data sem pedidos R$ 0', '');
      document.getElementById('financeDateSelect').value = '';
      Finance.render();

      // ------------------- 13. INTEGRIDADE -------------------
      this.groupName('Integridade');

      const allKeys = Object.keys(localStorage);
      const fyntex = allKeys.filter(k => k.startsWith('fyntex_'));
      this.assert(fyntex.length === 0, 'sem chaves fyntex_', fyntex.length ? fyntex.join(',') : 'OK');

      const deadIds = ['updateOverlay', 'updateProgressBar', 'updateProgressPercent', 'updateStatusText', 'updateStageText', 'updateProgressBytes', 'btnReloadNow', 'btnCloseApp'];
      const found = deadIds.filter(id => !!document.getElementById(id));
      this.assert(found.length === 0, 'sem IDs de overlay antigo', found.length ? found.join(',') : 'OK');

      // Objetos globais (const declara binding global, mas nao vira window[...])
      const globalGet = (name) => { try { return eval(name); } catch { return undefined; } };
      const globals = ['State', 'Auth', 'UI', 'Chart', 'Notifications', 'Dashboard', 'Orders', 'Clients', 'Settings', 'Updates', 'Finance', 'Trash'];
      const present = globals.filter(name => {
        const g = globalGet(name);
        return g && typeof g === 'object' && Object.keys(g).length > 0;
      });
      this.assert(present.length === globals.length, 'objetos globais', present.length + '/' + globals.length);

      // Funcoes globais
      const funcs = ['fmt', 'fmtDate', 'fmtDateStr', 'escapeHTML', 'maskPhone', 'badgeClass', 'formatWeight', 'migrateOrder', 'getOrderTotal'];
      const fpresent = funcs.filter(name => typeof globalGet(name) === 'function');
      this.assert(fpresent.length === funcs.length, 'funcoes globais', fpresent.length + '/' + funcs.length);
    },

    // ========================================================
    // FINALIZACAO
    // ========================================================
    _finish() {
      this.btn.disabled = false;
      this.btn.textContent = 'Executar Testes';

      const failures = this.results.filter(r => !r.isGroup && !r.pass);
      const total = this.results.filter(r => !r.isGroup).length;

      const report = {
        timestamp: new Date().toISOString(),
        appVersion: Updates.verAtual,
        total, passed: this.passed, failed: this.failed,
        failures: failures.map(f => ({ group: f.group, name: f.name, detail: f.detail }))
      };
      try { localStorage.setItem('confeitex_test_results', JSON.stringify(report)); } catch (e) {}

      // Relatorio
      const repEl = document.getElementById('testReport');
      repEl.style.display = 'block';
      repEl.innerHTML = '<strong style="font-size:1.1rem;">Resumo:</strong> ' + total + ' testes &mdash; ' +
        '<span style="color:var(--color-success);font-weight:700;">' + this.passed + ' OK</span>' +
        ' / <span style="color:var(--color-danger);font-weight:700;">' + this.failed + ' falhas</span>' +
        (failures.length > 0 ? '<br><br><strong style="color:var(--color-danger);">Falhas (' + failures.length + '):</strong><div style="max-height:300px;overflow-y:auto;margin-top:0.5rem;">' +
          failures.map(f => '<div class="report-fail">[' + f.group + '] <strong>' + f.name + '</strong> <span style="color:var(--text-muted);">' + f.detail + '</span></div>').join('') +
          '</div>' : '');

      // Botoes
      const dlBtn = document.getElementById('btnDownloadReport');
      const copyBtn = document.getElementById('btnCopyReport');
      dlBtn.disabled = false; dlBtn.style.opacity = '1';
      copyBtn.disabled = false; copyBtn.style.opacity = '1';

      dlBtn.onclick = () => {
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'confeitex_test_report.json'; a.click();
        URL.revokeObjectURL(url);
      };
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(JSON.stringify(report, null, 2)).then(() => {
          copyBtn.textContent = 'Copiado!';
          setTimeout(() => { copyBtn.textContent = 'Copiar Relatorio'; }, 2000);
        });
      };
    }
  };

  document.getElementById('btnRunTests').addEventListener('click', () => {
    TestRunner.runAll().catch(err => {
      document.getElementById('testOutput').innerHTML +=
        '<div class="test-result fail"><div class="icon">ERRO</div><div class="name">Fatal: ' + err.message + '</div><div class="detail">' + (err.stack || '') + '</div></div>';
      const btn = document.getElementById('btnRunTests');
      btn.disabled = false; btn.textContent = 'Executar Testes';
    });
  });
  </script>
</body>
</html>
